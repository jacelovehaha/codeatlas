[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas"
version = "0.1.0"
description = "Turn a Python codebase into a queryable knowledge graph for AI agents and humans."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "jacelovehaha" }]
keywords = ["codebase", "knowledge-graph", "static-analysis", "ast", "mcp", "ai-agents", "code-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
codeatlas = "codeatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
